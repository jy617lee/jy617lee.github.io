<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Shift — 교대근무 스케줄 위젯</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#00704A">
  <meta name="description" content="The Shift — 사내 스케줄 스크린샷 한 장으로 등록하고, 홈·잠금화면 위젯에서 오늘의 근무를 바로 확인하는 교대근무 스케줄 위젯 앱.">
  <style>
    :root { --cream:#F7F4EF; --ink:#1C1B1F; --muted:#7A7065; --accent:#00704A; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--cream); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column; align-items:center; padding:24px; line-height:1.6;
    }
    /* 한국어: 어절 한가운데서 끊기지 않게. 기본 CSS는 한글을 아무 데서나 자른다. */
    :lang(ko) { word-break:keep-all; }
    /* 일본어: 어절 단위 줄바꿈(지원 브라우저) + 금칙 처리, 문단 고아 글자 방지 */
    :lang(ja) { word-break:auto-phrase; line-break:strict; }
    p { text-wrap:pretty; }
    .card { width:100%; max-width:560px; margin:auto 0; }
    .lang-toggle { display:flex; justify-content:flex-end; gap:4px; margin-bottom:18px; }
    .lang-toggle button {
      border:1px solid #E4DED4; background:transparent; color:var(--muted);
      padding:5px 12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;
    }
    .lang-toggle button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .app { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
    .badge {
      width:64px; height:64px; border-radius:15px; flex:0 0 auto;
      background:#fff; border:1px solid #E4DED4; object-fit:contain;
    }
    h1 { font-size:24px; margin:0; }
    .tagline { color:var(--muted); margin:2px 0 0; font-size:14px; }
    p { font-size:15px; }
    .store-badges { display:flex; flex-direction:column; gap:10px; margin:18px auto 6px; max-width:320px; }
    .store-badge {
      display:flex; align-items:center; gap:16px; padding:14px 20px; border-radius:16px;
      border:1px solid #D8D1C5; background:#fff; color:var(--ink); text-decoration:none;
    }
    .store-badge:hover { border-color:var(--accent); }
    .store-icon { width:30px; height:30px; flex:0 0 auto; }
    .store-eyebrow { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .store-name { display:block; font-size:18px; font-weight:700; line-height:1.25; }
    .features { margin:30px 0 6px; display:flex; flex-direction:column; gap:10px; }
    .feature {
      display:flex; gap:14px; padding:14px 18px; border-radius:16px;
      border:1px solid #D8D1C5; background:#fff;
    }
    .feature-icon { width:22px; height:22px; flex:0 0 auto; color:var(--accent); margin-top:1px; }
    .feature-title { margin:0; font-size:15px; font-weight:700; line-height:1.35; }
    .feature-desc { margin:3px 0 0; font-size:14px; color:var(--muted); line-height:1.5; }
    .section-title { margin:34px 0 0; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .meta { width:100%; max-width:560px; margin-top:32px; padding-top:20px; border-top:1px solid #E4DED4; color:var(--muted); font-size:14px; }
    .meta a { color:var(--accent); text-decoration:none; }
    .meta a:hover { text-decoration:underline; }
    .row { margin:4px 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ja">日本語</button>
    </div>

    <div class="app">
      <img class="badge" src="/assets/shift-icon.png" width="64" height="64" alt="The Shift">
      <div>
        <h1>The Shift</h1>
        <p class="tagline" data-i18n="tagline">교대근무 스케줄 위젯</p>
      </div>
    </div>

    <p data-i18n="body">
      사내 스케줄 화면을 <strong>스크린샷 한 장</strong>으로 등록하면,
      홈 화면과 잠금화면 <strong>위젯</strong>에서 오늘의 출·퇴근 시간을 바로 확인할 수 있어요.
      주간·월간 미리보기, 근무 카운트다운, 캘린더 자동 추가까지 지원합니다.
    </p>

    <div class="store-badges">
      <a class="store-badge" id="cta-ios" href="https://apps.apple.com/kr/app/the-shift/id6782529001">
        <svg class="store-icon" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <span><span class="store-eyebrow" data-i18n="badgeIos">Download on the</span><span class="store-name">App Store</span></span>
      </a>
      <a class="store-badge" id="cta-android" href="https://play.google.com/store/apps/details?id=com.schedule.shift&hl=ko">
        <svg class="store-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M6 3 L26 24 L6 45 Z"/><path fill="#34A853" d="M6 3 L31.9 18.1 L26 24 Z"/><path fill="#FBBC04" d="M31.9 18.1 L42 24 L31.9 29.9 L26 24 Z"/><path fill="#EA4335" d="M26 24 L31.9 29.9 L6 45 Z"/></svg>
        <span><span class="store-eyebrow" data-i18n="badgeAndroid">Get it on</span><span class="store-name">Google Play</span></span>
      </a>
    </div>

    <h2 class="section-title" data-i18n="featuresTitle">기능</h2>
    <div class="features" id="features"></div>

  </main>

  <footer class="meta">
    <div class="row"><a href="/support.html" data-i18n="support">지원 · 문의</a></div>
    <div class="row"><a href="/privacy-policy.html" data-i18n="privacy">개인정보처리방침</a></div>
    <div class="row">Jeeyun Lee</div>
    <div class="row"><a href="mailto:jy617.lee@gmail.com">jy617.lee@gmail.com</a></div>
  </footer>

  <script>
    // 국문/영문/일문 전환 — 기본은 사용자 브라우저 언어, 선택은 localStorage에 기억.
    var STRINGS = {
      ko: {
        title: "The Shift — 교대근무 스케줄 위젯",
        tagline: "교대근무 스케줄 위젯",
        body: "사내 스케줄 화면을 <strong>스크린샷 한 장</strong>으로 등록하면, 홈 화면과 잠금화면 <strong>위젯</strong>에서 오늘의 출·퇴근 시간을 바로 확인할 수 있어요. 주간·월간 미리보기, 근무 카운트다운, 캘린더 자동 추가까지 지원합니다.",
        badgeIos: "다운로드하기",
        badgeAndroid: "다운로드하기",
        ctaIosHref: "https://apps.apple.com/kr/app/the-shift/id6782529001",
        ctaAndroidHref: "https://play.google.com/store/apps/details?id=com.schedule.shift&hl=ko",
        support: "지원 · 문의",
        privacy: "개인정보처리방침",
        featuresTitle: "기능",
        features: [
          { icon:"camera", title:"스크린샷 한 장으로 등록", desc:"사내 스케줄 화면을 찍어 올리면 끝이에요. 두 달치도 여러 장 한 번에 올릴 수 있고, 읽은 결과는 저장 전에 사진과 나란히 놓고 확인해요." },
          { icon:"widget", title:"홈·잠금화면 위젯", desc:"주간·2주·월간 미리보기, 오늘의 출퇴근 시간, 다음 근무까지 남은 시간. 배경 투명도도 취향대로 맞출 수 있어요." },
          { icon:"bell", title:"근무 시작 전 알림", desc:"울리는 알람이 아니라 딱 한 번 오는 푸시예요. 몇 분 전에 받을지 고르면 돼요." },
          { icon:"calendar", title:"캘린더 자동 추가", desc:"등록한 근무를 기기 캘린더에 그대로 얹어요. 일정 제목과 시간 표기 방식도 정할 수 있어요." },
          { icon:"people", title:"함께 일하는 동료", desc:"여러 사람이 적힌 매장 근무표를 올리면 그날 누가 같이 일하는지 타임라인으로 보여드려요. 동료 이름은 기기에만 남습니다." },
          { icon:"repeat", title:"반복 근무는 한 번만", desc:"주기가 있는 근무표는 패턴을 찾아 12개월치를 한 번에 만들어요. 매달 다시 올릴 필요가 없어요." }
        ]
      },
      en: {
        title: "The Shift — Shift Work Schedule Widget",
        tagline: "Shift work schedule widget",
        body: "Add your work schedule with <strong>a single screenshot</strong> and see today's shift right on your <strong>home and lock screen widgets</strong>. Weekly and monthly previews, shift countdown, and automatic calendar sync included.",
        badgeIos: "Download on the",
        badgeAndroid: "Get it on",
        ctaIosHref: "https://apps.apple.com/us/app/the-shift/id6782529001",
        ctaAndroidHref: "https://play.google.com/store/apps/details?id=com.schedule.shift&hl=en",
        support: "Support",
        privacy: "Privacy Policy",
        featuresTitle: "Features",
        features: [
          { icon:"camera", title:"One screenshot is enough", desc:"Snap your workplace schedule and you're done. Add several photos at once for two months, and check the result side by side with the photo before saving." },
          { icon:"widget", title:"Home and Lock Screen widgets", desc:"Weekly, two-week and monthly previews, today's hours, and a countdown to your next shift. Background opacity is yours to set." },
          { icon:"bell", title:"A heads-up before your shift", desc:"Not a ringing alarm — one push notification. Choose how many minutes ahead." },
          { icon:"calendar", title:"Automatic calendar sync", desc:"Your shifts land in your device calendar. Set the event title and how times are shown." },
          { icon:"people", title:"Who's on with you", desc:"Upload a store roster with several people and see who shares your shift that day. Coworker names stay on your device." },
          { icon:"repeat", title:"Set a rotation once", desc:"For repeating patterns, the app finds the cycle and fills a year ahead. No re-uploading every month." }
        ]
      },
      ja: {
        title: "The Shift — シフト勤務スケジュールウィジェット",
        tagline: "シフト勤務のスケジュールウィジェット",
        body: "職場のスケジュール画面を<strong>スクリーンショット1枚</strong>で登録すると、ホーム画面とロック画面の<strong>ウィジェット</strong>で今日の出勤・退勤時間をすぐ確認できます。週間・月間プレビュー、勤務カウントダウン、カレンダー自動追加にも対応しています。",
        badgeIos: "アプリをダウンロード",
        badgeAndroid: "アプリをダウンロード",
        ctaIosHref: "https://apps.apple.com/jp/app/the-shift/id6782529001",
        ctaAndroidHref: "https://play.google.com/store/apps/details?id=com.schedule.shift&hl=ja",
        support: "サポート・お問い合わせ",
        privacy: "プライバシーポリシー",
        featuresTitle: "機能",
        features: [
          { icon:"camera", title:"スクショ1枚で登録", desc:"職場のスケジュール画面を撮って上げるだけ。2か月分をまとめて追加でき、保存前に写真と並べて確認できます。" },
          { icon:"widget", title:"ホーム・ロック画面ウィジェット", desc:"週間・2週間・月間プレビュー、今日の勤務時間、次の勤務までのカウントダウン。背景の透明度も調整できます。" },
          { icon:"bell", title:"勤務開始前のお知らせ", desc:"鳴り続けるアラームではなく、1回だけ届くプッシュ通知。何分前に受け取るかを選べます。" },
          { icon:"calendar", title:"カレンダー自動追加", desc:"登録した勤務を端末のカレンダーに追加します。予定のタイトルや時刻の表示方法も選べます。" },
          { icon:"people", title:"一緒に働く同僚", desc:"複数人の勤務表を上げると、その日に誰と一緒かをタイムラインで表示します。同僚の名前は端末にのみ保存されます。" },
          { icon:"repeat", title:"繰り返し勤務は一度だけ", desc:"周期のある勤務表はパターンを見つけて12か月分をまとめて作成。毎月上げ直す必要がありません。" }
        ]
      }
    };
    // 기능 아이콘 — 스트로크 한 벌로 통일. currentColor라 강조색을 그대로 받는다.
    var ICONS = {
      camera: '<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-1.8A1 1 0 0 1 9.1 3h5.8a1 1 0 0 1 .9.5l1 1.8h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.5"/>',
      widget: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
      bell: '<path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
      people: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16.5 5.5a3.2 3.2 0 0 1 0 6"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
      repeat: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'
    };
    function renderFeatures(list) {
      var host = document.getElementById("features");
      host.innerHTML = (list || []).map(function (f) {
        return '<div class="feature">' +
          '<svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          (ICONS[f.icon] || "") + '</svg>' +
          '<div><p class="feature-title">' + f.title + '</p>' +
          '<p class="feature-desc">' + f.desc + '</p></div></div>';
      }).join("");
    }
    function applyLang(lang) {
      var t = STRINGS[lang] || STRINGS.ko;
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (typeof t[key] === "string") { el.innerHTML = t[key]; }
      });
      renderFeatures(t.features);
      document.getElementById("cta-ios").href = t.ctaIosHref;
      document.getElementById("cta-android").href = t.ctaAndroidHref;
      document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
      try { localStorage.setItem("shift-lang", lang); } catch (e) {}
    }
    function initialLang() {
      try {
        var saved = localStorage.getItem("shift-lang");
        if (saved === "ko" || saved === "en" || saved === "ja") { return saved; }
      } catch (e) {}
      var nav = (navigator.language || "en").toLowerCase();
      if (nav.indexOf("ko") === 0) { return "ko"; }
      if (nav.indexOf("ja") === 0) { return "ja"; }
      return "en";
    }
    document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () { applyLang(btn.getAttribute("data-lang")); });
    });
    applyLang(initialLang());
  </script>
</body>
</html>
