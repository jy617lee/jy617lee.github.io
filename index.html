  <style>
    :root {
      --cream:#F7F4EF; --paper:#fff; --ink:#15140F; --muted:#6F675C;
      --line:#E7E1D7; --accent:#00704A; --accent-soft:#EAF3EF;
      --radius:24px; --shell:1040px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--cream); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
      line-height:1.62; -webkit-font-smoothing:antialiased;
    }
    /* 한국어: 어절 한가운데서 끊기지 않게. 기본 CSS는 한글을 아무 데서나 자른다. */
    :lang(ko) { word-break:keep-all; }
    /* 일본어: 어절 단위 줄바꿈(지원 브라우저) + 금칙 처리 */
    :lang(ja) { word-break:auto-phrase; line-break:strict; }
    p { text-wrap:pretty; margin:0; }
    h1,h2,h3 { margin:0; letter-spacing:-.02em; line-height:1.24; }
    img { max-width:100%; height:auto; display:block; }
    a { color:inherit; }
    .shell { width:100%; max-width:var(--shell); margin:0 auto; padding:0 26px; }

    /* 상단 바 — 스크롤해도 붙어 있고 뒤가 비친다 */
    .nav {
      position:sticky; top:0; z-index:20; background:rgba(247,244,239,.82);
      backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
      border-bottom:1px solid rgba(231,225,215,.9);
    }
    .nav-in { display:flex; align-items:center; gap:12px; height:60px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:700; font-size:16px; }
    .brand img { width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; }
    .nav-spacer { flex:1; }
    .lang { display:flex; gap:2px; }
    .lang button {
      border:0; background:transparent; color:var(--muted); cursor:pointer;
      padding:6px 9px; border-radius:9px; font-size:13px; font-weight:600; font-family:inherit;
    }
    .lang button.active { background:var(--accent-soft); color:var(--accent); }
    .nav-cta {
      display:none; text-decoration:none; background:var(--accent); color:#fff;
      padding:8px 16px; border-radius:999px; font-size:14px; font-weight:700;
    }

    /* 히어로 */
    .hero { padding-top:64px; padding-bottom:8px; text-align:center; }
    .eyebrow { font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--accent); margin-bottom:14px; }
    .hero h1 { font-size:clamp(30px,7.2vw,52px); white-space:pre-line; font-weight:800; }
    .hero-sub { margin:18px auto 0; max-width:560px; white-space:pre-line; font-size:16px; color:var(--muted); }
    .badges { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:26px 0 0; }
    .badge-link {
      display:flex; align-items:center; gap:12px; padding:12px 20px; border-radius:16px;
      border:1px solid var(--line); background:var(--paper); text-decoration:none; min-width:210px;
      transition:border-color .15s ease, transform .15s ease;
    }
    .badge-link:hover { border-color:var(--accent); transform:translateY(-1px); }
    .badge-link svg { width:26px; height:26px; flex:0 0 auto; }
    .badge-eyebrow { display:block; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    .badge-name { display:block; font-size:17px; font-weight:700; line-height:1.2; }

    .shot {
      border-radius:26px; border:1px solid var(--line); overflow:hidden; background:#fff;
      box-shadow:0 18px 40px -22px rgba(21,20,15,.35);
    }

    /* 기능 섹션 — 텍스트와 화면을 번갈아 놓는다 */
    .section-label {
      margin:88px 0 0; text-align:center; font-size:12px; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    }
    .rows { display:flex; flex-direction:column; gap:64px; margin-top:36px; }
    .row { display:grid; gap:28px; align-items:center; }
    .row-text .eyebrow { margin-bottom:10px; }
    .row-text h2 { font-size:clamp(23px,4.6vw,32px); font-weight:800; }
    .row-text p { margin-top:12px; font-size:16px; color:var(--muted); }
    .row-shot { max-width:290px; margin:0 auto; }
    /* 합성 컷은 배경이 페이지와 같은 크림색이라 액자를 씌우지 않는다.
       아래로 흘러 나가는 폰이 잘린 카드처럼 보이지 않게 바닥을 페이드아웃한다. */
    .row-shot--wide { max-width:430px; }
    .row-shot--wide img {
      -webkit-mask-image:linear-gradient(180deg,#000 84%,transparent 100%);
      mask-image:linear-gradient(180deg,#000 84%,transparent 100%);
    }

    /* 추가 기능 */
    .grid { display:grid; gap:12px; margin-top:32px; }
    .card { display:flex; gap:14px; padding:18px 20px; border-radius:18px; border:1px solid var(--line); background:var(--paper); }
    .card svg { width:22px; height:22px; flex:0 0 auto; color:var(--accent); margin-top:2px; }
    .card h3 { font-size:16px; font-weight:700; }
    .card p { margin-top:4px; font-size:14.5px; color:var(--muted); }

    /* 마무리 */
    .cta { margin:96px 0 0; padding:56px 28px; border-radius:32px; background:var(--accent); color:#fff; text-align:center; }
    .cta h2 { font-size:clamp(24px,5vw,36px); white-space:pre-line; font-weight:800; }
    .cta p { margin-top:14px; white-space:pre-line; color:rgba(255,255,255,.86); font-size:16px; }
    .cta .badge-link { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.34); color:#fff; }
    .cta .badge-link:hover { border-color:#fff; }
    .cta .badge-eyebrow { color:rgba(255,255,255,.78); }

    footer { margin-top:72px; padding:32px 0 44px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
    footer a { color:var(--accent); text-decoration:none; }
    footer a:hover { text-decoration:underline; }
    .foot-links { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:12px; }
    .foot-row { margin:2px 0; }

    @media (min-width:760px) {
      .shell { padding:0 48px; }
      .nav-cta { display:inline-block; }
      .hero { padding-top:88px; padding-bottom:0; }
      .row { grid-template-columns:1fr 1fr; gap:56px; }
      .row:nth-child(even) .row-shot { order:-1; }
      .row-text { text-align:left; }
      .rows { gap:96px; margin-top:48px; }
      .grid { grid-template-columns:1fr 1fr; gap:14px; }
      .section-label { margin-top:120px; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .badge-link { transition:none; } }
  </style>

    /* 화면 컷의 실제 크기와 액자 여부. import는 폰 두 대를 얹은 합성 컷이라 액자를 씌우지 않는다. */
    var SHOTS = {
      "import": { w:900, h:1330, cls:"row-shot row-shot--wide" }
    };
    var SHOT_DEFAULT = { w:760, h:1650, cls:"row-shot shot" };

    var APPLE = '<svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';
    var PLAY = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M6 3 L26 24 L6 45 Z"/><path fill="#34A853" d="M6 3 L31.9 18.1 L26 24 Z"/><path fill="#FBBC04" d="M31.9 18.1 L42 24 L31.9 29.9 L26 24 Z"/><path fill="#EA4335" d="M26 24 L31.9 29.9 L6 45 Z"/></svg>';

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
    function badges(t) {
      return '<a class="badge-link" href="' + t.ctaIosHref + '">' + APPLE +
        '<span><span class="badge-eyebrow">' + esc(t.badgeIos) + '</span><span class="badge-name">App Store</span></span></a>' +
        '<a class="badge-link" href="' + t.ctaAndroidHref + '">' + PLAY +
        '<span><span class="badge-eyebrow">' + esc(t.badgeAndroid) + '</span><span class="badge-name">Google Play</span></span></a>';
    }
    function svg(inner) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
    }
    function applyLang(lang) {
      var t = STRINGS[lang] || STRINGS.ko;
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var v = t[el.getAttribute("data-i18n")];
        if (typeof v === "string") { el.textContent = v; }
      });
      document.getElementById("badges-top").innerHTML = badges(t);
      document.getElementById("badges-bottom").innerHTML = badges(t);
      document.getElementById("rows").innerHTML = t.sections.map(function (s) {
        var shot = SHOTS[s.img] || SHOT_DEFAULT;
        return '<article class="row">' +
          '<div class="row-text"><p class="eyebrow">' + esc(s.eyebrow) + '</p>' +
          '<h2>' + esc(s.title) + '</h2><p>' + esc(s.desc) + '</p></div>' +
          '<div class="' + shot.cls + '"><img src="/assets/shots/' + s.img + '.jpg" ' +
          'width="' + shot.w + '" height="' + shot.h + '" loading="lazy" ' +
          'alt="' + esc(s.title) + '"></div></article>';
      }).join("");
      document.getElementById("more").innerHTML = t.more.map(function (m) {
        return '<div class="card">' + svg(ICONS[m.icon] || "") +
          '<div><h3>' + esc(m.title) + '</h3><p>' + esc(m.desc) + '</p></div></div>';
      }).join("");
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === lang);
      });
      try { localStorage.setItem("shift-lang", lang); } catch (e) {}
    }
    function initialLang() {
      try {
        var saved = localStorage.getItem("shift-lang");
        if (saved === "ko" || saved === "en" || saved === "ja") { return saved; }
      } catch (e) {}
      var nav = (navigator.language || "en").toLowerCase();
      if (nav.indexOf("ko") === 0) { return "ko"; }
      if (nav.indexOf("ja") === 0) { return "ja"; }
      return "en";
    }
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); });
    });
    applyLang(initialLang());
  </script>
</body>
</html>
