  <script>
    // 국문/영문/일문 전환 — 기본은 사용자 브라우저 언어, 선택은 localStorage(shift-lang) 공유.
    var STRINGS = {
      ko: {
        htmlTitle: "The Shift — 개인정보처리방침",
        back: "← The Shift",
        title: "개인정보처리방침",
        updated: "시행일: 2026년 10월 17일 · The Shift (Jeeyun Lee)",
        contactLead: "문의:",
        sections: [
          { h: "요약", b: "<p>The Shift는 <strong>계정 없이</strong> 동작합니다. 근무표는 사용자의 기기에 저장되며, 이름·이메일·사번·위치를 묻거나 수집하지 않습니다. 정보가 기기 밖으로 나가는 경우는 아래 셋뿐입니다: 직접 <strong>근무표 보내기(제보)</strong>를 누를 때, <strong>근무표 공유</strong>를 쓸 때, 그리고 익명 사용 통계·광고입니다.</p>" },
          { h: "기기에만 저장되는 정보", b: "<p>등록한 근무표와 앱 설정은 기기 안에만 저장됩니다. 앱을 지우면 함께 지워지고 복구할 수 없습니다.</p>" },
          { h: "근무표 사진·파일 읽기", b: "<p>근무표 사진·엑셀·PDF는 <strong>기기 안에서</strong> 읽고, 읽은 뒤에는 보관하지 않습니다. 구글 시트 링크를 넣으면 기기가 구글에서 그 시트를 직접 내려받아 읽습니다(우리 서버를 거치지 않습니다). 사진은 시스템 선택기로 사용자가 고른 것에만 접근합니다.</p>" },
          { h: "근무표 보내기(제보) — 직접 누를 때만", b: "<p>앱이 아직 못 읽는 근무표를 사용자가 직접 보내면 다음을 받습니다.</p><ul><li>근무표 사진 또는 엑셀·PDF 파일, 구글 시트 링크</li><li>기기가 그 근무표에서 읽은 글자와 위치(판독 결과), 정확도 제보면 사용자가 고친 칸</li><li>앱 버전·기기 모델·OS·언어와 지역, 기기에서 만든 무작위 익명 ID</li><li>원하는 경우에만 회신용 이메일</li></ul><p><strong>목적</strong>: 그 형식을 읽는 방법을 만들고, 완료되면 알림을 보내기 위해서입니다. 받은 자료는 AI(Anthropic Claude)가 분석해 읽는 방법을 만드는 데 쓰고, 그 밖의 목적으로 쓰거나 팔지 않습니다.</p><p><strong>보관</strong>: 작업 대기 기록은 30일 뒤 지워집니다. 제보는 작업용 Slack 채널에 남으며 1년이 지나면 지워집니다. 읽는 방법을 시험하기 위한 자료(원본과 이름·사번을 지운 판독 결과)는 비공개 저장소(GitHub)에 남을 수 있습니다. 삭제를 원하면 아래 메일로 알려 주세요.</p>" },
          { h: "근무표 공유 — 쓸 때만", b: "<p>매장 공유를 만들거나 참여하면 근무표·매장 이름·고른 이름이 <strong>기기에서 암호화된 뒤</strong> 서버에 올라갑니다. 열쇠는 초대 링크 안에만 있어 서버는 내용을 읽을 수 없습니다.</p><ul><li>서버가 보는 것: 암호문과 그 크기, 표의 마지막 날짜, 무작위 그룹·멤버 ID, 기기 종류(iOS·Android), 알림용 푸시 토큰, 설치 ID·접속 토큰의 해시값</li><li>요청이 너무 잦은지 보려고 IP 주소를 잠깐 쓰지만 저장하지 않습니다.</li><li><strong>보관</strong>: 표는 마지막 날짜에서 14일이 지나면 지워집니다. 나가거나 내보내지면 그 사람의 근무·이름 자료가, 관리자가 매장을 지우면 모든 근무표가 바로 지워집니다(참여했다는 기록과 해시값은 남습니다).</li></ul>" },
          { h: "알림", b: "<p>제보가 끝났을 때와 근무표 공유에서 새 표가 올라왔을 때 알림을 보내기 위해 Google Firebase Cloud Messaging(FCM)의 푸시 토큰을 씁니다. 제보 알림은 그 제보에만 쓰는 주제(topic)로 보냅니다.</p>" },
          { h: "앱 사용 통계 (Google Firebase)", b: "<p>앱 개선을 위해 화면 조회·기능 사용 같은 익명 사용 통계를 수집합니다. 식별자는 기기에서 만든 무작위 UUID라 개인을 특정할 수 없습니다. 근무표 내용·사진·이름은 통계에 들어가지 않습니다. 자세한 내용은 <a href='https://policies.google.com/privacy' target='_blank' rel='noopener'>Google 개인정보처리방침</a>을 참고하세요.</p>" },
          { h: "광고 (Google AdMob)", b: "<p>무료 이용 시 광고가 표시됩니다. iOS의 앱 추적 투명성(ATT)에서 허용한 경우에만 광고 식별자(IDFA)가 맞춤 광고에 쓰일 수 있고, 거부하면 일반 광고가 표시됩니다. 자세한 내용은 <a href='https://policies.google.com/technologies/ads' target='_blank' rel='noopener'>Google 광고 정책</a>을 참고하세요.</p>" },
          { h: "처리를 맡기는 곳", b: "<ul><li><strong>Cloudflare</strong>: 제보 받기, 근무표 공유 서버·저장</li><li><strong>Slack</strong>: 제보 보관·작업</li><li><strong>Anthropic</strong>: 제보한 근무표 분석(AI)</li><li><strong>GitHub</strong>: 읽는 방법 시험 자료(비공개)</li><li><strong>Google</strong>: 사용 통계·광고·알림</li></ul>" },
          { h: "국외 이전", b: "<p>위 업체들의 서버는 국외(주로 미국, Cloudflare는 전 세계 거점)에 있어, 기능을 쓸 때 정보가 네트워크로 그곳에 전송·보관됩니다.</p><ul><li><strong>Cloudflare</strong>(미국): 제보 자료, 근무표 공유의 암호문·푸시 토큰·해시값 — 보관 기간은 위 제보·근무표 공유 항목과 같습니다.</li><li><strong>Google</strong>(미국): 익명 사용 통계, 광고 식별자, 푸시 토큰 — Google 정책에 따릅니다.</li><li><strong>Slack·Anthropic·GitHub</strong>(미국): 제보 자료 — 위 제보 항목의 기간까지.</li></ul><p>제보와 근무표 공유는 쓰지 않으면 이전되지 않습니다. 통계·광고는 기기 설정에서 끌 수 있습니다.</p>" },
          { h: "근무표에 있는 동료의 정보", b: "<p>매장 근무표에는 함께 일하는 사람의 이름과 근무가 들어 있습니다. 표를 올리는 관리자는 매장 동료에게 공유한다는 사실을 알려 주세요. 표는 기기에서 암호화되어 서버는 읽을 수 없고, 초대 링크를 받은 그 매장 참여자만 봅니다. 자기 이름이 든 표를 지우고 싶으면 매장 관리자에게 요청해 주세요 — 관리자는 표를 다시 올리거나 매장을 지울 수 있습니다. 표는 마지막 날짜에서 14일이 지나면 자동으로 지워집니다.</p>" },
          { h: "권한", b: "<ul><li><strong>캘린더</strong>: 캘린더 연동을 켠 경우 근무를 기기 캘린더에 넣는 데만 씁니다.</li><li><strong>사진</strong>: 시스템 선택기로 고른 사진에만 접근합니다.</li><li><strong>알림</strong>: 근무 알림·제보 완료·근무표 공유 알림에 씁니다.</li></ul>" },
          { h: "결제", b: "<p>Pro 구매는 Apple App Store 또는 Google Play가 처리하며, 앱은 결제 수단 정보에 접근하지 않습니다.</p>" },
          { h: "삭제 요청과 변경 고지", b: "<p>보낸 제보나 공유 자료의 삭제를 원하면 아래 메일로 알려 주세요. 이 방침이 바뀌면 이 페이지에 시행일과 함께 게시합니다.</p>" }
        ]
      },
      en: {
        htmlTitle: "The Shift — Privacy Policy",
        back: "← The Shift",
        title: "Privacy Policy",
        updated: "Effective: October 17, 2026 · The Shift (Jeeyun Lee)",
        contactLead: "Contact:",
        sections: [
          { h: "Summary", b: "<p>The Shift works <strong>without accounts</strong>. Your schedules are stored on your device, and we never ask for or collect your name, email, employee ID, or location. Information leaves your device only in three cases: when you tap <strong>Send schedule (report)</strong>, when you use <strong>schedule sharing</strong>, and for anonymous usage analytics and ads.</p>" },
          { h: "Data stored on your device only", b: "<p>Your schedules and settings stay on your device. They are deleted with the app and cannot be recovered.</p>" },
          { h: "Reading schedule photos and files", b: "<p>Schedule photos, Excel files, and PDFs are read <strong>on your device</strong> and not kept afterwards. If you enter a Google Sheets link, your device downloads that sheet directly from Google (it does not go through our servers). The app accesses only the photos you pick in the system picker.</p>" },
          { h: "Sending a schedule (report) — only when you tap it", b: "<p>When you send a schedule the app can't read yet, we receive:</p><ul><li>The schedule photo, or the Excel/PDF file or Google Sheets link</li><li>The text and positions your device read from it, and for accuracy reports the cells you corrected</li><li>App version, device model, OS, language and region, and a random anonymous ID created on your device</li><li>Your email, only if you choose to leave it for a reply</li></ul><p><strong>Purpose</strong>: to learn to read that format and notify you when it's done. The material is analyzed by AI (Anthropic Claude) to build the reading method; it is not used for anything else or sold.</p><p><strong>Retention</strong>: work-queue records are deleted after 30 days. Reports stay in our work Slack channel and are deleted after one year. Test material for the reading method (the original and the read text with names and employee IDs removed) may remain in a private repository (GitHub). Email us to request deletion.</p>" },
          { h: "Schedule sharing — only if you use it", b: "<p>When you create or join a shared store, the schedule, store name, and the name you picked are <strong>encrypted on your device</strong> before upload. The key exists only inside the invite link, so the server cannot read the contents.</p><ul><li>What the server sees: the ciphertext and its size, the schedule's last date, random group and member IDs, device platform (iOS/Android), a push token for notifications, and hashes of the install ID and access tokens</li><li>Your IP address is used briefly to limit excessive requests and is not stored.</li><li><strong>Retention</strong>: schedules are deleted 14 days after their last date. When someone leaves or is removed, their schedule and name data are deleted right away; when the admin deletes the store, all schedules are deleted right away (a record of membership and the hash values remain).</li></ul>" },
          { h: "Notifications", b: "<p>We use a Google Firebase Cloud Messaging (FCM) push token to notify you when your report is done and when a new shared schedule is posted. Report notifications go to a topic used only for that report.</p>" },
          { h: "Usage analytics (Google Firebase)", b: "<p>To improve the app, we collect anonymous usage statistics such as screen views and feature usage. The identifier is a random UUID created on your device and cannot identify you. Schedule contents, photos, and names are never included. See the <a href='https://policies.google.com/privacy' target='_blank' rel='noopener'>Google Privacy Policy</a>.</p>" },
          { h: "Advertising (Google AdMob)", b: "<p>Ads are shown to free users. The advertising identifier (IDFA) is used for personalized ads only if you allow it in the iOS App Tracking Transparency prompt; otherwise non-personalized ads are shown. See <a href='https://policies.google.com/technologies/ads' target='_blank' rel='noopener'>how Google uses ad data</a>.</p>" },
          { h: "Service providers", b: "<ul><li><strong>Cloudflare</strong>: receiving reports, schedule-sharing server and storage</li><li><strong>Slack</strong>: storing and working on reports</li><li><strong>Anthropic</strong>: AI analysis of reported schedules</li><li><strong>GitHub</strong>: private test material for reading methods</li><li><strong>Google</strong>: analytics, ads, notifications</li></ul>" },
          { h: "International transfers", b: "<p>The servers of the providers above are outside Korea (mainly in the US; Cloudflare also uses locations worldwide), so information is sent over the network and stored there when you use a feature.</p><ul><li><strong>Cloudflare</strong> (US): report material, and for schedule sharing the ciphertext, push tokens, and hash values — kept as described under reports and schedule sharing above.</li><li><strong>Google</strong> (US): anonymous usage analytics, advertising identifier, push tokens — per Google's policies.</li><li><strong>Slack, Anthropic, GitHub</strong> (US): report material — kept as described under reports above.</li></ul><p>Nothing is transferred for reports or sharing unless you use them. Analytics and ads can be limited in your device settings.</p>" },
          { h: "Coworkers' information in schedules", b: "<p>A store schedule contains the names and shifts of the people you work with. If you post a schedule as the admin, please let your coworkers know you are sharing it. Schedules are encrypted on the device so the server cannot read them; only members of that store who received the invite link can see them. To have a schedule with your name removed, ask the store admin — the admin can post a new schedule or delete the store. Schedules are deleted automatically 14 days after their last date.</p>" },
          { h: "Permissions", b: "<ul><li><strong>Calendar</strong>: used only to add your shifts to your device calendar when calendar export is on.</li><li><strong>Photos</strong>: only photos you pick in the system picker are accessed.</li><li><strong>Notifications</strong>: shift reminders, report updates, and schedule-sharing alerts.</li></ul>" },
          { h: "Payments", b: "<p>Pro purchases are processed by the Apple App Store or Google Play. The app never accesses your payment details.</p>" },
          { h: "Deletion requests and changes", b: "<p>Email us to request deletion of a report or shared data. If this policy changes, the update will be posted here with a new effective date.</p>" }
        ]
      },
      ja: {
        htmlTitle: "The Shift — プライバシーポリシー",
        back: "← The Shift",
        title: "プライバシーポリシー",
        updated: "施行日: 2026年10月17日 · The Shift (Jeeyun Lee)",
        contactLead: "お問い合わせ:",
        sections: [
          { h: "概要", b: "<p>The Shiftは<strong>アカウントなし</strong>で動作します。勤務表は端末に保存され、氏名・メールアドレス・社員番号・位置情報を求めたり収集したりしません。情報が端末の外に出るのは次の3つの場合だけです：<strong>勤務表を送る（報告）</strong>を自分で押したとき、<strong>勤務表の共有</strong>を使うとき、そして匿名の利用統計と広告です。</p>" },
          { h: "端末にのみ保存される情報", b: "<p>登録した勤務表とアプリの設定は端末内にのみ保存されます。アプリを削除すると一緒に削除され、復元できません。</p>" },
          { h: "勤務表の写真・ファイルの読み取り", b: "<p>勤務表の写真・Excel・PDFは<strong>端末内で</strong>読み取り、読み取り後は保存しません。Googleスプレッドシートのリンクを入れると、端末がGoogleからそのシートを直接ダウンロードして読み取ります（当社のサーバーを経由しません）。写真はシステムの選択画面で選んだものにのみアクセスします。</p>" },
          { h: "勤務表を送る（報告）— 自分で押したときだけ", b: "<p>アプリがまだ読めない勤務表を送ると、次の情報を受け取ります。</p><ul><li>勤務表の写真、またはExcel・PDFファイル、Googleスプレッドシートのリンク</li><li>端末がその勤務表から読み取った文字と位置（読み取り結果）、精度の報告では修正したマス</li><li>アプリのバージョン・端末の機種・OS・言語と地域、端末で作られたランダムな匿名ID</li><li>希望した場合のみ、返信用メールアドレス</li></ul><p><strong>目的</strong>：その形式を読めるようにし、完了をお知らせするためです。受け取った資料はAI（Anthropic Claude）が分析して読み取り方法を作るのに使い、それ以外の目的に使ったり販売したりしません。</p><p><strong>保存</strong>：作業待ちの記録は30日後に削除されます。報告は作業用のSlackチャンネルに残り、1年経つと削除されます。読み取り方法を試すための資料（原本と、氏名・社員番号を消した読み取り結果）は非公開のリポジトリ（GitHub）に残ることがあります。削除をご希望の場合は下記メールでお知らせください。</p>" },
          { h: "勤務表の共有 — 使うときだけ", b: "<p>店舗の共有を作成または参加すると、勤務表・店舗名・選んだ名前は<strong>端末で暗号化してから</strong>サーバーにアップロードされます。鍵は招待リンクの中にしかないため、サーバーは内容を読めません。</p><ul><li>サーバーが見るもの：暗号文とそのサイズ、勤務表の最終日、ランダムなグループ・メンバーID、端末の種類（iOS・Android）、通知用のプッシュトークン、インストールIDとアクセストークンのハッシュ値</li><li>リクエストが多すぎないか確認するためにIPアドレスを一時的に使いますが、保存しません。</li><li><strong>保存</strong>：勤務表は最終日から14日経つと削除されます。退出したり外されたりするとその人の勤務・名前の資料が、管理者が店舗を削除するとすべての勤務表がすぐに削除されます（参加した記録とハッシュ値は残ります）。</li></ul>" },
          { h: "通知", b: "<p>報告の完了時と、勤務表の共有で新しい勤務表が届いたときに通知するため、Google Firebase Cloud Messaging（FCM）のプッシュトークンを使います。報告の通知はその報告専用のトピックに送ります。</p>" },
          { h: "利用統計（Google Firebase）", b: "<p>アプリ改善のため、画面表示や機能の利用状況といった匿名の利用統計を収集します。識別子は端末で作られたランダムなUUIDで、個人を特定できません。勤務表の内容・写真・氏名が統計に含まれることはありません。詳細は<a href='https://policies.google.com/privacy' target='_blank' rel='noopener'>Googleプライバシーポリシー</a>をご覧ください。</p>" },
          { h: "広告（Google AdMob）", b: "<p>無料でご利用の場合、広告が表示されます。iOSのアプリのトラッキングの透明性（ATT）で許可した場合にのみ、広告識別子（IDFA）がパーソナライズド広告に使われることがあり、許可しない場合は一般的な広告が表示されます。詳細は<a href='https://policies.google.com/technologies/ads' target='_blank' rel='noopener'>Googleの広告ポリシー</a>をご覧ください。</p>" },
          { h: "処理を委託する先", b: "<ul><li><strong>Cloudflare</strong>：報告の受け取り、勤務表共有のサーバー・保存</li><li><strong>Slack</strong>：報告の保存・作業</li><li><strong>Anthropic</strong>：報告された勤務表の分析（AI）</li><li><strong>GitHub</strong>：読み取り方法のテスト資料（非公開）</li><li><strong>Google</strong>：利用統計・広告・通知</li></ul>" },
          { h: "国外への移転", b: "<p>上記の委託先のサーバーは国外（主に米国、Cloudflareは世界各地の拠点）にあり、機能を使うと情報がネットワーク経由でそこへ送られ、保存されます。</p><ul><li><strong>Cloudflare</strong>（米国）：報告の資料、勤務表共有の暗号文・プッシュトークン・ハッシュ値 — 保存期間は上記の報告・勤務表共有と同じです。</li><li><strong>Google</strong>（米国）：匿名の利用統計、広告識別子、プッシュトークン — Googleのポリシーに従います。</li><li><strong>Slack・Anthropic・GitHub</strong>（米国）：報告の資料 — 上記の報告の期間まで。</li></ul><p>報告と勤務表共有は、使わなければ移転されません。統計・広告は端末の設定で制限できます。</p>" },
          { h: "勤務表に含まれる同僚の情報", b: "<p>店舗の勤務表には、一緒に働く人の氏名と勤務が含まれます。管理者として勤務表を共有する場合は、同僚に共有することを伝えてください。勤務表は端末で暗号化されるためサーバーは読めず、招待リンクを受け取ったその店舗の参加者だけが見られます。自分の名前が入った勤務表を消したい場合は店舗の管理者に依頼してください — 管理者は勤務表を上げ直すか、店舗を削除できます。勤務表は最終日から14日が過ぎると自動で削除されます。</p>" },
          { h: "権限", b: "<ul><li><strong>カレンダー</strong>：カレンダー連携をオンにした場合、勤務を端末のカレンダーに追加するためだけに使います。</li><li><strong>写真</strong>：システムの選択画面で選んだ写真にのみアクセスします。</li><li><strong>通知</strong>：勤務のお知らせ・報告の完了・勤務表共有のお知らせに使います。</li></ul>" },
          { h: "決済", b: "<p>Proの購入はApple App StoreまたはGoogle Playが処理し、アプリが決済情報にアクセスすることはありません。</p>" },
          { h: "削除のご依頼と変更のお知らせ", b: "<p>送った報告や共有した資料の削除をご希望の場合は、下記メールでお知らせください。本ポリシーを変更した場合は、施行日とあわせて本ページに掲載します。</p>" }
        ]
      }
    };
    function renderSections(items) {
      var container = document.getElementById("sections");
      container.innerHTML = "";
      items.forEach(function (item) {
        var sec = document.createElement("section");
        var h = document.createElement("h2");
        h.textContent = item.h;
        sec.appendChild(h);
        var body = document.createElement("div");
        body.innerHTML = item.b;
        sec.appendChild(body);
        container.appendChild(sec);
      });
    }
    function applyLang(lang) {
      var t = STRINGS[lang] || STRINGS.ko;
      document.documentElement.lang = lang;
      document.title = t.htmlTitle;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (t[key]) { el.innerHTML = t[key]; }
      });
      renderSections(t.sections);
      document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
      try { localStorage.setItem("shift-lang", lang); } catch (e) {}
    }
    function initialLang() {
      try {
        var saved = localStorage.getItem("shift-lang");
        if (saved === "ko" || saved === "en" || saved === "ja") { return saved; }
      } catch (e) {}
      var nav = (navigator.language || "en").toLowerCase();
      if (nav.indexOf("ko") === 0) { return "ko"; }
      if (nav.indexOf("ja") === 0) { return "ja"; }
      return "en";
    }
    document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () { applyLang(btn.getAttribute("data-lang")); });
    });
    applyLang(initialLang());
  </script>
</body>
</html>
